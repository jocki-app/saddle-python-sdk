name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.ref_name }}
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - id: version
        run: |
          python - <<'PY'
          import os,tomllib
          from packaging.version import Version
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          if os.environ['RELEASE_TAG']!='v'+version:raise SystemExit('Release tag must equal project.version')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('prerelease='+str(Version(version).is_prerelease).lower()+'\n')
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: Publish distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
  pypi:
    needs: github
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
