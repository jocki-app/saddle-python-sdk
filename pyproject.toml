[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saddle-sdk"
version = "0.1.0"
description = "Portable sidecar archives for description, distributed state, lineage and exchange"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.urls]
Source = "https://github.com/jocki-app/saddle-python-sdk"
Documentation = "https://jocki-app.github.io/saddle-website/"

[tool.setuptools.packages.find]
where = ["src"]
